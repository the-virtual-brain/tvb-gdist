name: Build

on:
  release:
    types: [published]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-13]

    steps:
      - uses: actions/checkout@v4

      # Used to host cibuildwheel
      - uses: actions/setup-python@v5

      - name: Install cibuildwheel
        run: python -m pip install setuptools cibuildwheel

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        # to supply options, put them in 'env', like:
        env:
          CIBW_ARCHS_MACOS: "x86_64,arm64"
          CIBW_SKIP: "pp* *-win32 *-manylinux_i686 *-musl*"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # merge all artifacts together to make the upload_pypi job easier
  # otherwise we would have to write each artifact name explicitly in the download step from upload_pypi
  merge_artifacts:
    name: Merge artifacts
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    steps:
      - name: Merge wheels
        uses: actions/upload-artifact/merge@v4
        with:
          name: merged-artifact
          patterns: |
            wheels-*
            sdist
          delete-merged: true

  upload_pypi:
    name: Upload to PyPI
    needs: merge_artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Download merged artifact
        uses: actions/download-artifact@v4
        with:
          name: merged-artifact
          path: dist

      - name: Release on Pypi
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USER }}
          TWINE_PASSWORD: ${{ secrets.PYPI_PASS }}
        run: |
          echo "Publishing on pypi..."
          python -m pip install -U twine
          twine upload dist/* 
